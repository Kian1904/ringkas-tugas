<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K's Tools for School — Ringkas Tugas AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --overlay: rgba(15, 23, 42, 0.5);
            --sidebar-w: 260px;
            --topbar-h: 70px;
            --radius: 12px;
            --transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 15px;
        }

        /* ARSITEKTUR LAYOUT RESPONSIVE */
        .sidebar {
            position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
            background-color: var(--surface); border-right: 1px solid var(--border);
            z-index: 100; padding: 1.5rem; display: flex; flex-direction: column;
            transform: translateX(0); transition: var(--transition);
        }

        .topbar {
            position: fixed; top: 0; right: 0; left: var(--sidebar-w); height: var(--topbar-h);
            background-color: var(--surface); border-bottom: 1px solid var(--border);
            z-index: 90; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
        }

        .wrapper { padding-top: var(--topbar-h); padding-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
        .main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; flex: 1; display: flex; flex-direction: column; }

        /* KOMPONEN AUTH DI SIDEBAR */
        .auth-box {
            background: #f1f5f9; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; text-align: center;
        }
        .user-info { display: flex; align-items: center; gap: 0.75rem; text-align: left; margin-bottom: 0.75rem; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .credit-badge { background: #e0e7ff; color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: inline-block; }

        .btn-google {
            background: white; border: 1px solid var(--border); padding: 0.6rem 1rem; border-radius: var(--radius);
            cursor: pointer; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.2s;
        }
        .btn-google:hover { background: #f8fafc; }
        .btn-logout { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: underline; }

        /* MENU MODE SELECTION */
        .mode-chips { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
        .mode-chip { background: var(--surface); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .mode-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* AREA ANTARMUKA CHAT (STYLE CHATGPT) */
        .chat-container {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            flex: 1; min-height: 400px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 1.5rem;
        }
        .chat-history { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        
        .bubble { max-width: 80%; padding: 0.85rem 1.25rem; border-radius: var(--radius); line-height: 1.5; word-wrap: break-word; }
        .bubble.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bubble.ai { background: #f1f5f9; color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
        .bubble table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        .bubble th, .bubble td { border: 1px solid var(--border); padding: 0.5rem; font-size: 0.9rem; }

        /* INPUT AREA DI BAGIAN BAWAH */
        .input-box { display: flex; gap: 0.75rem; padding: 1rem; background: var(--surface); border-top: 1px solid var(--border); }
        .input-box textarea { flex: 1; height: 50px; resize: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; outline: none; font-family: inherit; }
        .input-box textarea:focus { border-color: var(--primary); }
        .btn-send { background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .btn-send:hover { background: var(--primary-hover); }

        .menu-toggle { display: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--overlay); z-index: 95; opacity: 0; visibility: hidden; transition: var(--transition); }

        @media (max-width: 767.98px) {
            .sidebar { transform: translateX(-100%); }
            .topbar { left: 0; }
            .wrapper { padding-left: 0; }
            .menu-toggle { display: block; }
            body.sidebar-open .sidebar { transform: translateX(0); }
            body.sidebar-open .sidebar-overlay { opacity: 1; visibility: visible; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
        <h2 style="font-weight: 800; color: var(--primary); margin-bottom: 1.5rem;">K's Tools</h2>
        
        <div class="auth-box" id="authBox">
            <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 0.5rem;">Masuk untuk mulai belajar</p>
            <button class="btn-google" onclick="loginGoogle()">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Login dengan Google
            </button>
        </div>

        <ul class="nav-list" style="list-style: none; margin-top: 1rem;">
            <li style="padding: 0.75rem 1rem; font-weight: 600; color: var(--primary); background: #eef2ff; border-radius: var(--radius);">
                <i class="fa-solid fa-comments"></i> Ruang Obrolan AI
            </li>
        </ul>
    </aside>

    <header class="topbar">
        <div>
            <span class="topbar-title" style="font-weight: 700; font-size: 1.2rem;">Ringkas Tugas AI</span>
        </div>
        <button class="menu-toggle" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    </header>

    <div class="wrapper">
        <main class="main">
            
            <div class="mode-chips">
                <div class="mode-chip active" onclick="changeMode('ringkas', this)">✨ Ringkas Materi</div>
                <div class="mode-chip" onclick="changeMode('soal', this)">🎓 Buat Latihan Soal</div>
                <div class="mode-chip" onclick="changeMode('translate', this)">🌐 Terjemahan</div>
            </div>

            <div class="chat-container">
                <div class="chat-history" id="chatHistory">
                    <div class="bubble ai">Halo! Selamat datang di K's Tools. Silakan ketik draf materi tugas sekolahmu di bawah atau login terlebih dahulu ya!</div>
                </div>
                
                <div class="input-box">
                    <textarea id="userInput" placeholder="Ketik pesan atau tempel materi tugas di sini..."></textarea>
                    <button class="btn-send" onclick="kirimPesan()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

        </main>
    </div>

    <script>
        // KONEKSI OTOMATIS KE SUPABASE KIAN1904
        const SUPABASE_URL = "https://xqrrimruddjmnhutxcjf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-r0safaA4GUE6o9I2NupBw_NqyBJn15";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentMode = 'ringkas';
        let chatMemori = [];

        // CEK STATUS LOGIN USER
        window.onload = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                tampilkanUserTerlogin(session.user);
            }
            
            supabase.auth.onAuthStateChange((_event, session) => {
                if (session) tampilkanUserTerlogin(session.user);
            });
        };

        // FUNGSI LOGIN GOOGLE
        async function loginGoogle() {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
        }

        // FUNGSI LOGOUT
        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // TAMPILKAN INFO USER & KREDIT
        async function tampilkanUserTerlogin(user) {
            currentUser = user;
            const authBox = document.getElementById('authBox');
            
            let { data: userCredits } = await supabase
                .from('user_credits')
                .select('credits')
                .eq('id', user.id)
                .single();

            const sisaKredit = userCredits ? userCredits.credits : 100;
            const inisialNama = user.email.substring(0, 2).toUpperCase();

            authBox.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${inisialNama}</div>
                    <div>
                        <div style="font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; max-width: 140px;">${user.email}</div>
                        <button class="btn-logout" onclick="logout()">Keluar</button>
                    </div>
                </div>
                <div class="credit-badge">Sisa Kredit: ${sisaKredit} ⭐</div>
            `;
        }

        function changeMode(mode, element) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }

        const menuBtn = document.getElementById('menuBtn');
        const overlay = document.getElementById('sidebarOverlay');
        if(menuBtn) menuBtn.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
        if(overlay) overlay.addEventListener('click', () => document.body.classList.remove('sidebar-open'));

        // LOGIKA CHAT MULTI-TURN
        async function kirimPesan() {
            const inputEl = document.getElementById('userInput');
            const historyEl = document.getElementById('chatHistory');
            const text = inputEl.value.trim();
            if(!text) return;

            inputEl.value = '';
            historyEl.innerHTML += `<div class="bubble user">${text}</div>`;
            historyEl.scrollTop = historyEl.scrollHeight;

            chatMemori.push({ role: "user", content: `[Mode: ${currentMode}] ${text}` });

            const loadingId = 'load-' + Date.now();
            historyEl.innerHTML += `<div class="bubble ai" id="${loadingId}"><i class="fa-solid fa-spinner fa-spin" style="color: var(--primary);"></i> Sedang menganalisis materi...</div>`;
            historyEl.scrollTop = historyEl.scrollHeight;

            try {
                const response = await fetch("https://ringkas-api.ryalandsokay.workers.dev", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        messages: chatMemori,
                        userId: currentUser ? currentUser.id : null 
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if(data.error) {
                    historyEl.innerHTML += `<div class="bubble ai" style="color: red;">⚠️ Gagal memproses data: ${data.error}</div>`;
                } else {
                    const aiJawaban = data.choices[0].message.content;
                    historyEl.innerHTML += `<div class="bubble ai">${formatJawabanKeTabel(aiJawaban)}</div>`;
                    
                    chatMemori.push({ role: "assistant", content: aiJawaban });

                    if(chatMemori.length > 6) {
                        chatMemori = chatMemori.slice(chatMemori.length - 6);
                    }

                    if(currentUser) tampilkanUserTerlogin(currentUser);
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                historyEl.innerHTML += `<div class="bubble ai" style="color: red;">⚠️ Terjadi kesalahan jaringan. Coba lagi nanti.</div>`;
            }
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        function formatJawabanKeTabel(text) {
            if(text.includes('<table>')) return text;
            return text.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
